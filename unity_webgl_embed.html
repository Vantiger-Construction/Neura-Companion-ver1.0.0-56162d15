
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Neura VR Room</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; height: 100%; }
    #unity-container { width: 100%; height: 100%; position: relative; }
    #unity-canvas { width: 100%; height: 100%; background: #000; }
    #loading-bar { position: absolute; top: 50%; width: 100%; text-align: center; color: white; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="loading-bar">🔄 Loading Neura VR Experience...</div>
    <canvas id="unity-canvas"></canvas>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Neura.loader.js";
    var config = {
      dataUrl: buildUrl + "/Neura.data",
      frameworkUrl: buildUrl + "/Neura.framework.js",
      codeUrl: buildUrl + "/Neura.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Vantiger Construction",
      productName: "Neura Companion VR",
      productVersion: "1.0"
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#loading-bar");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        loadingBar.innerHTML = "Loading... " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        loadingBar.innerHTML = "❌ Failed to load Unity WebGL: " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
